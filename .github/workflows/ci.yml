name: Initial CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
# aufgabe 3 matrix: GitHub startet pro Java-Version einen eigenen Job, alle laufen parallel
    strategy:
      matrix:
        java-version: [ '17', '21' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

# aufgabe 3: Java-Version kommt aus der Matrix statt fix '17', sonst laufen beide Jobs mit Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
# aufgabe 2 zum chaching
# aufgabe 3: OS und Java-Version im Key, damit jede Version ihren eigenen Cache hat; restore-keys sind der Fallback, wenn kein exakter Treffer existiert
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ matrix.java-version }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ matrix.java-version }}-
            maven-${{ runner.os }}-

# aufgabe 4: holt das Secret aus Settings -> Secrets und gibt es nur diesem Step als Umgebungsvariable; im Log erscheint es als ***
      - name: Build and test with Maven
        env:
          APP_SECRET_TOKEN: ${{ secrets.APP_SECRET_TOKEN }}
        run: mvn -B clean verify

# aufgabe 5: speichert das gebaute JAR nach dem Lauf, sonst ist es mit der Runner-VM weg; Version im Namen, weil beide Matrix-Jobs hochladen und Namen eindeutig sein muessen
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar-${{ matrix.java-version }}
          path: target/demo-ci-project-1.0-SNAPSHOT.jar

# aufgabe 5: Testreports sichern; if: always() laedt sie auch hoch, wenn Tests fehlschlagen, gerade dann braucht man sie
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.java-version }}
          path: target/surefire-reports/
